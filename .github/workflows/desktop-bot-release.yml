name: Desktop Bot Source Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'hermes-bots-v*'

permissions:
  contents: read

concurrency:
  group: desktop-bot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bootstrap:
    name: macOS source bootstrap
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true

      - name: Verify clean source setup
        run: ./scripts/setup-hermes-bots.sh --verify

      - name: Build Bot product
        env:
          HERMES_DESKTOP_PRODUCT: bot
          VITE_HERMES_DESKTOP_PRODUCT: bot
        run: npm --workspace apps/desktop run build

  bot-e2e:
    name: Bot Mode E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Audit JavaScript dependencies
        run: |
          npm audit --omit=dev
          npm audit

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install Python dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run Bot SKU quality gate
        working-directory: apps/desktop
        run: |
          bash -n ../../scripts/setup-hermes-bots.sh
          ../../scripts/setup-hermes-bots.sh --help
          npm run typecheck
          npm run lint
          npm run test:ui
          npm run test:desktop:platforms

      - name: Run Bot SKU packaged E2E
        working-directory: apps/desktop
        env:
          HERMES_DESKTOP_PRODUCT: bot
          VITE_HERMES_DESKTOP_PRODUCT: bot
        run: |
          xvfb-run --auto-servernum npm run test:e2e:bot

  publish-source-release:
    name: Publish source release
    if: startsWith(github.ref, 'refs/tags/hermes-bots-v')
    needs: [bot-e2e, source-bootstrap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
